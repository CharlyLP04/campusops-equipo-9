# Generated by engineering-professor. This workflow is formative feedback.
# Final grading repeats critical checks in an instructor-controlled runner.
name: Week 02 Academic Feedback

on:
  push:
    tags:
      - week-02-final
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: week-02-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          fetch-tags: true
      - name: Use Node.js 22.22.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Reproducible setup
        run: make setup
      - name: Baseline feedback
        run: make feedback
      - name: AC-01 — reproducibility
        run: make verify-week-02
      - name: AC-02 — public behavior
        run: make public-test-week-02
      - name: AC-03 — declared failure evidence
        if: startsWith(github.ref, 'refs/tags/week-02-final')
        run: make evidence-week-02
      - name: Upload academic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-evidence-week-02-arquitectura-justificable
          if-no-files-found: warn
          path: |
            reports/week-02/**
            evidence/week-02/**
